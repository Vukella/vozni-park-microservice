# Docker Compose overrides
# Active when SPRING_PROFILES_ACTIVE=docker

# Database ? resolves via Docker DNS, separate schema from the monolith
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/fleet_service_db?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:vozni_user}
spring.datasource.password=${DB_PASSWORD:vozni_pass}

# Use the PLAINTEXT listener (Docker-internal, resolves via Docker DNS)
spring.kafka.bootstrap-servers=kafka:9092