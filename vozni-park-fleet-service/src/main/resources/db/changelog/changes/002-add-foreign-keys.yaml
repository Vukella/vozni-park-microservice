databaseChangeLog:

  # 101-103: REFERENCE / LOOKUP RELATIONSHIPS
  - changeSet:
      id: 101-fk-vehicle-model-brand
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          foreignKeyConstraintExists:
            foreignKeyName: fk_vehicle_model_brand
      changes:
        - addForeignKeyConstraint:
            baseTableName: vehicle_model
            baseColumnNames: brand_id
            constraintName: fk_vehicle_model_brand
            referencedTableName: brand
            referencedColumnNames: id_brand

  - changeSet:
      id: 102-fk-vehicle-subtype-vehicle-type
      author: nemanja
      preConditions:
        onFail: MARK_RAN
        not:
          foreignKeyConstraintExists:
            foreignKeyName: fk_vehicle_subtype_vehicle_type
      changes:
        - addForeignKeyConstraint:
            baseTableName: vehicle_subtype
            baseColumnNames: vehicle_type_id
            constraintName: fk_vehicle_subtype_vehicle_type
            referencedTableName: vehicle_type
            referencedColumnNames: id_vehicle_type

  - changeSet:
