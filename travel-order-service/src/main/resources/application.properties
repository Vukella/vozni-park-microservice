#Server
server.port=8084

#Database
spring.datasource.url=jdbc:mysql://localhost:3307/travel_order_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

#Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

#Kafka
spring.kafka.bootstrap-servers=localhost:9094

#Jackson
# Serialize LocalDate / Instant as ISO strings, not arrays

#Logging
logging.level.com.voznipark.travelorder=DEBUG
logging.level.org.apache.kafka=WARN
logging.level.org.hibernate.SQL=WARN
