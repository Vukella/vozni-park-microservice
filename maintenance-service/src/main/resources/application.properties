# Server
server.port=8087
spring.application.name=technical-maintenance-service

# Database
spring.datasource.url=jdbc:mysql://localhost:3307/technical_maintenance_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA schema is managed by Liquibase; validate only
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Kafka
spring.kafka.bootstrap-servers=localhost:9094

# Mileage thresholds (configurable without code change)
maintenance.mileage.minor-service-interval-km=10000
maintenance.mileage.major-service-interval-km=50000

# Logging
logging.level.com.voznipark.maintenance=DEBUG
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=INFO