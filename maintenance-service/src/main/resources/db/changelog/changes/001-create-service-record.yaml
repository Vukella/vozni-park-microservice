databaseChangeLog:
  - changeSet:
      id: 001-create-service-record
      author: nemanja.vukelic
      changes:
        - createTable:
            tableName: service_record
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: vehicle_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: vehicle_sap_number
                  type: INT
              - column:
                  name: service_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: trigger_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  defaultValue: PENDING
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: source_event_reference
                  type: BIGINT
              - column:
                  name: scheduled_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME
                  defaultValueComputed: CURRENT_TIMESTAMP
