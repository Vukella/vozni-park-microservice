spring.application.name=document-reporting-service
server.port=8088

# Database
spring.datasource.url=jdbc:mysql://localhost:3307/document_reporting_service_db?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Kafka
# Port 9094 = host-accessible listener (KRaft mode)
spring.kafka.bootstrap-servers=localhost:9094

# Fleet service REST client
fleet.service.base-url=${FLEET_SERVICE_URL:http://localhost:8083}

# Logging
logging.level.com.voznipark.reporting=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.pdfbox=WARN