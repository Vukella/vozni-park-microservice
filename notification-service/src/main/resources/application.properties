#Server
server.port=8085
spring.application.name=notification-service

#Kafka
# KRaft broker same port used by fleet-service and travel-order-service
spring.kafka.bootstrap-servers=localhost:9094

#SMTP Mailtrap Sandbox
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Notification config
# All notifications are sent to a single hardcoded admin address.
# In a production system these would be fetched from a user/preferences service.
notification.email.from=noreply@voznipark.rs
notification.email.admin=admin@voznipark.rs

#Logging
logging.level.com.voznipark.notification=DEBUG
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=INFO