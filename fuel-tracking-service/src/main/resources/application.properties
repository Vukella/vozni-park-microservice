# Server
server.port=8089

# Database
spring.datasource.url=jdbc:mysql://localhost:3307/fuel_tracking_service_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Kafka
spring.kafka.bootstrap-servers=localhost:9094

# Fuel calculation ? static config (snapshot into DB row at record time)
fuel.price.per.liter=195.00
fuel.consumption.per.100km=10.0

# Logging
logging.level.com.voznipark.fueltracking=DEBUG
logging.level.org.apache.kafka=WARN
logging.level.org.hibernate.SQL=WARN